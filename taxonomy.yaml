# Category tree for the paper list. It mirrors the structure of the survey.
#
# bib2yaml.py assigns categories from where the survey cites each paper.
# A citation's location is its section file plus the path of headings above it.
# The script tries the rules in order, and the first rule whose `file` matches
# and whose `heading` regex (if any) matches the heading path wins.
# Put specific rules before the fallback rule for the same file.
#
# render.py uses `groups` (in order) for the README layout.

groups:
  - id: background
    title: Background and Related Surveys
    survey: "§1"
  - id: framework
    title: Framework and Requirements
    survey: "§2"
  - id: specification
    title: "Specification (S): What Counts as Success"
    survey: "§3.1"
  - id: evidence
    title: "Evidence (E): What the Judge Gets to See"
    survey: "§3.2"
  - id: judgment
    title: "Judgment (J): Who Decides"
    survey: "§3.3"
  - id: credit
    title: "Credit Assignment and Aggregation (C)"
    survey: "§3.4"
  - id: cost-coupling
    title: Cost and Coupled Designs
    survey: "§3, §3.5, §3.6"
  - id: failure
    title: Failure Under Optimization
    survey: "§4"
  - id: monitoring
    title: Monitoring and Localization
    survey: "§5.1"
  - id: adaptation
    title: Anchored Adaptation
    survey: "§5.2–5.3"
  - id: rsi
    title: Recursive Self-Improvement
    survey: "§6"
  - id: benchmarks
    title: Benchmarks for Reward Systems
    survey: "App. B"
  - id: outlook
    title: Open Challenges
    survey: "§7"

